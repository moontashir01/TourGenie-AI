<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TourGenie AI — Plan trips end to end</title>
    <meta
      name="description"
      content="Turn a destination and a budget into a complete trip: itinerary, route, hotels and expenses in one place."
    />
    <meta name="theme-color" content="#0B1F2E" />

    <!-- The link preview. og.svg is the artwork; the crawlers that don't take
         SVG fall back to the title and description above, which is still a
         card rather than the bare URL they showed before. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TourGenie AI" />
    <meta property="og:title" content="TourGenie AI — Plan trips end to end" />
    <meta
      property="og:description"
      content="Turn a destination and a budget into a complete trip: itinerary, route, hotels and expenses in one place."
    />
    <meta property="og:image" content="/og.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TourGenie AI — Plan trips end to end" />
    <meta
      name="twitter:description"
      content="Turn a destination and a budget into a complete trip: itinerary, route, hotels and expenses in one place."
    />
    <meta name="twitter:image" content="/og.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-paper">
    <script>
      // Applied before the first paint, so a dark-mode visitor never gets a
      // white flash while React boots. ThemeContext owns it from then on.
      (function () {
        try {
          var stored = localStorage.getItem("tourgenie_theme");
          var dark =
            stored === "dark" ||
            ((!stored || stored === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          // Storage blocked — light mode is the safe default.
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
